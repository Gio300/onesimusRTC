# LiveKit server config. cloud-init copies this to livekit.generated.yaml with
# __API_KEY__/__API_SECRET__ replaced by freshly generated random values.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # Advertise the instance's public IP so phones on cellular/wifi can reach media.
  use_external_ip: true
redis:
  address: localhost:6379
turn:
  enabled: true
  # UDP 443 works through more mobile and restrictive networks while Caddy keeps
  # using TCP 443 for HTTPS. The two protocols can share the port safely.
  udp_port: 443
keys:
  __API_KEY__: __API_SECRET__
logging:
  level: info
  json: false
