<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OnesimusRTC &mdash; Caster</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/vendor/livekit-client.umd.min.js"></script>
</head>
<body>
  <div class="stage">
    <div class="videowrap">
      <video id="local" autoplay muted playsinline></video>
      <div class="overlay">
        <span class="pill" id="roompill">room</span>
        <span class="pill" id="status">connecting&hellip;</span>
      </div>
    </div>

    <div class="roster">
      <h3>Viewers &mdash; <span id="count">0</span></h3>
      <ul id="people"></ul>
    </div>

    <div class="controls">
      <button id="mic" class="ghost">Mute mic</button>
      <button id="cam" class="ghost">Stop video</button>
      <button id="audio" class="primary" hidden>Enable sound</button>
      <button id="share" class="ghost">Copy viewer link</button>
      <button id="leave" class="ghost">Leave</button>
    </div>
  </div>

  <div id="audio-sink" hidden></div>

  <script type="module" src="/caster.js"></script>
</body>
</html>
