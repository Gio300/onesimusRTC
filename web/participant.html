<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OnesimusRTC - Viewer</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/vendor/livekit-client.umd.min.js"></script>
</head>
<body>
  <div class="stage">
    <div class="videowrap">
      <video id="remote" autoplay playsinline></video>
      <div class="overlay">
        <span class="pill" id="roompill">room</span>
        <span class="overlay-right">
          <span class="pill presentation-label" id="presentation-title" hidden></span>
          <span class="pill" id="status">connecting...</span>
        </span>
      </div>
    </div>

    <div class="controls">
      <button id="talk" class="talk" disabled>Waiting for host</button>
      <button id="hand" class="ghost">Raise hand</button>
      <button id="audio" class="primary" hidden>Enable sound</button>
      <button id="leave" class="ghost">Leave</button>
    </div>
    <p class="hint meeting-hint" id="voice-help">You are listening with your camera
      blocked. Raise your hand when you want the host to enable your microphone.</p>
  </div>

  <div id="audio-sink" hidden></div>

  <script type="module" src="/participant.js"></script>
</body>
</html>
